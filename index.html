<h2>Theory :</h2>
<br>
<p><b>SGPA (Semester Grade Point Average)</b>
    <br>
SGPA represents the academic performance of a student in a single semester. It is calculated as the average of grade points obtained in all subjects of that semester.
    <br>
Mathematically:<br>
SGPA = (Sum of Grade Points of all subjects) / (Number of subjects)
<br>
<br>
<b>CGPA (Cumulative Grade Point Average)</b>
<br>
CGPA represents the overall academic performance across multiple semesters. It is calculated as the average of the SGPAs of the selected semesters.
<br>
Mathematically (for two semesters):<br>
CGPA = (SGPA₁ + SGPA₂) / 2
<br>
<br>
<br>
<p><b>Why to Use the SGPA-CGPA Simulator?</b>
<br>
The SGPA-CGPA simulator is designed to help students understand and predict their academic performance in advance. Instead of manually calculating grade points, the simulator provides a quick and accurate way to evaluate results.
<br><br>
It helps students:
<br>
• Plan their target grades for upcoming exams<br>
• Understand the impact of each subject on overall SGPA<br>
• Analyze different academic scenarios (best case / worst case)<br>
• Track performance improvement over semesters<br>
</p>

<br>

<p><b>How to Use the Simulator?</b>
<br>
The simulator is simple and user-friendly. Follow these steps:
<br><br>
1. Select your branch, year, and semester.<br>
2. Choose the expected or actual grade for each subject from the dropdown.<br>
3. The corresponding grade points will be automatically assigned.<br>
4. The system calculates SGPA based on grade points and credits.<br>
5. For multiple semesters, CGPA is calculated automatically.<br>
<br>
The simulator ensures accuracy and reduces manual errors in calculation.
</p>

<br>

<p><b>Input Constraints:</b><br>
<li>Grades must be selected from the given options (O, A+, A, B+, B, P, F).</li>
<li>Each subject must have a valid grade selected.</li>
</p>

<br>

<p><b>Technologies Used:</b><br>
<li>HTML – Structure of the web application</li>
<li>CSS – Styling and layout</li>
<li>JavaScript – Logic for calculations and interactivity</li>
</p>
