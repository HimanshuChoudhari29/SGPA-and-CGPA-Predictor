<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SGPA / CGPA Predictor</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#eef2ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.container{
    background:#fff;
    padding:25px;
    width:980px;
    border-radius:10px;
    box-shadow:0 0 12px rgba(0,0,0,0.15);
}
h2{text-align:center;}
.controls{text-align:center;margin-bottom:15px;}
select{padding:6px;font-size:15px;}
.semester{margin-top:10px;}
.subjects{margin-top:15px;}
.subject{margin-bottom:6px;}

.action-buttons{
    text-align:center;
    margin:10px 0;
}

button{
    padding:8px 18px;
    background:#2c7be5;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:15px;
    cursor:pointer;
    margin:5px;
}

.done-btn{
    display:block;
    margin:15px auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
table,th,td{border:1px solid #999;}
th,td{padding:8px;text-align:center;}
th{background:#dbe4ff;}
input{width:100px;padding:4px;}

.result{
    margin-top:15px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:green;
}
#calcBtn{display:none;}

#yearSection, #semesterSection, #subjectsContainer, .action-buttons, .done-btn{
    display:none;
}
body.dark{
background:#121212;
color:#eee;
}

body.dark .container{
background:#1e1e1e;
}

body.dark table th{
background:#555;
}

body.dark input,
body.dark select{
background:#2a2a2a;
color:#fff;
border:1px solid #555;
}
</style>
</head>

<body>

<div class="container">
<h2>SGPA / CGPA Predictor</h2>

<div class="controls">

<label><b>Select Branch:</b></label>
<select id="branch" onchange="handleBranch()">
<option value="">-- Select Branch --</option>
<option value="IT">Information Technology</option>
<option value="CE">Computer Engineering</option>
<option value="CER">Computer Engineering (Regional)</option>
<option value="ME">Mechanical Engineering</option>
<option value="CEV">Civil Engineering</option>
<option value="ENTC">Electronics & Telecommunication</option>
<option value="AIML">CSE (AI & ML)</option>
</select>

<br><br>

<div id="yearSection">
<label><b>Select Year:</b></label>
<select id="year" onchange="handleYear()">
<option value="">-- Select Year --</option>
<option value="1">1st Year</option>
<option value="2">2nd Year</option>
<option value="3">3rd Year</option>
<option value="4">4th Year</option>
</select>
</div>

<div id="semesterSection" class="semester">
<label><input type="checkbox" id="sem1" onclick="loadSubjects()"> <span id="sem1Label">Semester 1</span></label>
&nbsp;&nbsp;
<label><input type="checkbox" id="sem2" onclick="loadSubjects()"> <span id="sem2Label">Semester 2</span></label>
</div>

</div>

<div id="subjectsContainer" class="subjects"></div>

<div class="action-buttons">
<button onclick="selectAll()">Select All</button>
<button onclick="deselectAll()">Deselect All</button>
</div>

<button class="done-btn" onclick="generateTable()">Done</button>

<div id="tableContainer"></div>

<button id="calcBtn" onclick="calculateResult()">Calculate</button>

<div id="result" class="result"></div>
</div>

<script>

const itSem1=["LAUC (2 credits)","LAUC Laboratory (1 credit)","Chemistry (2 credits)","Chemistry Laboratory (2 credits)","DELD (2 credits)","DELD Laboratory (2 credits)","Python Programming Laboratory (2 credits)","Discrete Mathematics (3 credits)","Indian Knowledge System (2 credits)","Life Skills 1 (2 credits)"];
const itSem2=["Multivariate Calculus (2 credits)","Multivariate Calculus Laboratory (1 credit)","Physics (2 credits)","Physics Laboratory (2 credits)","Principles of Programming Languages (3 credits)","Programming Laboratory (2 credits)","Data Communication (2 credits)","Web Development Laboratory (2 credits)","Language (2 credits)","Life Skills 2 (2 credits)"];

const ceSem1=["LAUC (2 credits)","LAUC Laboratory (1 credit)","Chemistry (2 credits)","Chemistry Laboratory (2 credits)","Computer Programming & Problem Solving (3 credits)","Computer Programming & Problem Solving Laboratory 1 (2 credits)","Digital Electronics & Computer Organization (3 credits)","Digital Electronics Laboratory (1 credit)","Language (2 credits)","Life Skills 1 (2 credits)"];
const ceSem2=["Multivariate Calculus (2 credits)","Multivariate Calculus Laboratory (1 credit)","Physics (2 credits)","Physics Laboratory (2 credits)","Object Oriented Programming (3 credits)","Object Oriented Programming Laboratory (2 credits)","Discrete Mathematics (2 credits)","Computer Programming & Problem Solving Laboratory 2 (2 credits)","Indian Knowledge System (2 credits)","Life Skills 2 (2 credits)"];

const subjectData={
IT:{1:itSem1,2:itSem2},
CE:{1:ceSem1,2:ceSem2}
};

function handleBranch(){
resetAll();
if(branch.value){
document.getElementById("yearSection").style.display="block";
}
}

function handleYear(){
resetAll(false);
if(year.value){
document.getElementById("semesterSection").style.display="block";

const semMap={
1:["Semester 1","Semester 2"],
2:["Semester 3","Semester 4"],
3:["Semester 5","Semester 6"],
4:["Semester 7","Semester 8"]
};

sem1Label.innerText=semMap[year.value][0];
sem2Label.innerText=semMap[year.value][1];
}
}

function resetAll(full=true){
subjectsContainer.innerHTML="";
tableContainer.innerHTML="";
calcBtn.style.display="none";
result.innerHTML="";
sem1.checked=false;
sem2.checked=false;

if(full){
yearSection.style.display="none";
semesterSection.style.display="none";
subjectsContainer.style.display="none";
document.querySelector(".action-buttons").style.display="none";
document.querySelector(".done-btn").style.display="none";
}
}

function loadSubjects(){
const branch=document.getElementById("branch").value;
const year=document.getElementById("year").value;

if(!branch || !year) return;

subjectsContainer.innerHTML="";

const semDisplayMap={
1:[1,2],
2:[3,4],
3:[5,6],
4:[7,8]
};

if(sem1.checked) addSubjects(branch,1,semDisplayMap[year][0]);
if(sem2.checked) addSubjects(branch,2,semDisplayMap[year][1]);

if(sem1.checked || sem2.checked){
subjectsContainer.style.display="block";
document.querySelector(".action-buttons").style.display="block";
document.querySelector(".done-btn").style.display="block";
}
}

function addSubjects(branch,sem,actualSem){
subjectData[branch][sem].forEach(sub=>{
subjectsContainer.innerHTML+=`
<div class="subject">
<label>
<input type="checkbox" value="Sem ${actualSem} - ${sub}">
Sem ${actualSem} - ${sub}
</label>
</div>`;
});
}

function selectAll(){
document.querySelectorAll('#subjectsContainer input[type="checkbox"]').forEach(cb=>cb.checked=true);
}

function deselectAll(){
document.querySelectorAll('#subjectsContainer input[type="checkbox"]').forEach(cb=>cb.checked=false);
}

function generateTable(){
const selected=document.querySelectorAll('#subjectsContainer input:checked');
if(!selected.length){alert("Select subjects");return;}

let html=`<table>
<tr>
<th>Sr</th>
<th>Subject</th>
<th>Grade Expected/Actual</th>
<th>Grade Points</th>
</tr>`;

selected.forEach((s,i)=>{
html+=`
<tr>
<td>${i+1}</td>
<td>${s.value}</td>
<td>
<select onchange="updateGradePoint(this)">
<option value="">Select</option>
<option value="10">O</option>
<option value="9">A+</option>
<option value="8">A</option>
<option value="7">B+</option>
<option value="6">B</option>
<option value="5">P</option>
<option value="0">F</option>
</select>
</td>
<td><input type="text" readonly></td>
</tr>`;
});

tableContainer.innerHTML=html+"</table>";
}

function updateGradePoint(select){
let row=select.parentElement.parentElement;
let gradePoint=row.cells[3].querySelector("input");

if(select.value===""){
gradePoint.value="";
}else if(select.value==="0"){
gradePoint.value="Fail";
}else{
gradePoint.value=select.value;
}

checkFilled();
}

function checkFilled(){
const selects=document.querySelectorAll("table select");
for(let s of selects){
if(!s.value){calcBtn.style.display="none";return;}
}
calcBtn.style.display="block";
}

function calculateResult(){
const rows=document.querySelectorAll("table tr");

let s1=0,c1=0,s2=0,c2=0;

for(let i=1;i<rows.length;i++){
let sub=rows[i].cells[1].innerText;
let val=rows[i].cells[3].querySelector("input").value;
let gp=(val==="Fail")?0:parseInt(val);
let credit=parseInt(sub.match(/\((\d+)/)[1]);

if(sub.includes("Sem 1")||sub.includes("Sem 3")||sub.includes("Sem 5")||sub.includes("Sem 7")){
s1+=gp*credit;
c1+=credit;
}else{
s2+=gp*credit;
c2+=credit;
}
}

if(c1 && c2){
let sgpa1=s1/c1;
let sgpa2=s2/c2;
let cgpa=(sgpa1+sgpa2)/2;

result.innerHTML=`
SGPA Sem Group 1: ${sgpa1.toFixed(2)}<br>
SGPA Sem Group 2: ${sgpa2.toFixed(2)}<br>
<b>CGPA: ${cgpa.toFixed(2)}</b>`;
}
else{
let sgpa=(s1+s2)/(c1+c2);
result.innerHTML=`SGPA: ${sgpa.toFixed(2)}`;
}
}
window.addEventListener("message", function(event) {

    if(event.data.mode === "dark"){
        document.body.style.background = "#121212";
        document.body.style.color = "white";
        document.querySelector(".container").style.background = "#1e1e1e";
    }

    if(event.data.mode === "light"){
        document.body.style.background = "#eef2ff";
        document.body.style.color = "black";
        document.querySelector(".container").style.background = "#fff";
    }

});
</script>

</body>
</html>
